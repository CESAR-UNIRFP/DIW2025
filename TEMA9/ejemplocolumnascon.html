<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Justify-content en Bootstrap</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

  <style>
    .demo-area { background: #e9ddff; } 
  </style>
</head>

<body class="py-4">

  <div class="container text-center">
    <h1 class="h4 mb-4">Alineación horizontal (justify-content-*)</h1>

    <div class="demo-area border border-2 border-dark rounded p-3">

      <div class="row justify-content-start g-0 mb-3">
        <div class="col-4 border border-2 border-dark p-3 demo-area">Start</div>
        <div class="col-4 border border-2 border-dark p-3 demo-area">Start</div>
      </div>

      <div class="row justify-content-center g-0 mb-3">
        <div class="col-4 border border-2 border-dark p-3 demo-area">Center</div>
        <div class="col-4 border border-2 border-dark p-3 demo-area">Center</div>
      </div>

      <div class="row justify-content-end g-0 mb-3">
        <div class="col-4 border border-2 border-dark p-3 demo-area">End</div>
        <div class="col-4 border border-2 border-dark p-3 demo-area">End</div>
      </div>

      <div class="row justify-content-around g-0 mb-3">
        <div class="col-4 border border-2 border-dark p-3 demo-area">Around</div>
        <div class="col-4 border border-2 border-dark p-3 demo-area">Around</div>
      </div>

      <div class="row justify-content-between g-0 mb-3">
        <div class="col-4 border border-2 border-dark p-3 demo-area">Between</div>
        <div class="col-4 border border-2 border-dark p-3 demo-area">Between</div>
      </div>

      <div class="row justify-content-evenly g-0">
        <div class="col-4 border border-2 border-dark p-3 demo-area">Evenly</div>
        <div class="col-4 border border-2 border-dark p-3 demo-area">Evenly</div>
      </div>

    </div>
  </div>

</body>
</html>
