<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ejemplo 3 - Grid responsive</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="py-4">
  <div class="container">
    <h1 class="mb-3">Container + Grid</h1>
    <p class="text-muted">
      Móvil: 1 columna · <code>md</code>: 2 columnas · <code>lg</code>: 3 columnas
    </p>

    <div class="row g-3">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="border rounded p-3">Caja 1</div>
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <div class="border rounded p-3">Caja 2</div>
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <div class="border rounded p-3">Caja 3</div>
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <div class="border rounded p-3">Caja 4</div>
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <div class="border rounded p-3">Caja 5</div>
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <div class="border rounded p-3">Caja 6</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
          crossorigin="anonymous"></script>
</body>
</html>
