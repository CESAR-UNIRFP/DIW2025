<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grid: contenido de ancho variable (con bordes y fondo)</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
</head>
<body class="py-5">

  <div class="container text-center">

    <div class="row justify-content-md-center mb-4">
      <div class="col col-lg-2 border border-2 border-dark  bg-primary-subtle p-3">
        1 of 3
      </div>
      <div class="col-md-auto border border-2 border-dark bg-primary-subtle p-3">
        Variable width content
      </div>
      <div class="col col-lg-2 border border-2 border-dark  bg-primary-subtle p-3">
        3 of 3
      </div>
    </div>

    <div class="row">
      <div class="col border border-2 border-dark bg-primary-subtle p-3">
        1 of 3
      </div>
      <div class="col-md-auto border border-2 border-dark bg-primary-subtle p-3">
        Variable width content
      </div>
      <div class="col col-lg-2 border border-2 border-dark bg-primary-subtle p-3">
        3 of 3
      </div>
    </div>

  </div>

</body>
</html>
