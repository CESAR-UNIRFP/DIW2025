<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ejemplo 05 – List group</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-5">
    <h1 class="h4 mb-4">Selecciona tu deporte favorito</h1>

    <ul class="list-group" style="max-width: 22rem;">
      <li class="list-group-item active" aria-current="true">Fútbol</li>
      <li class="list-group-item">Baloncesto</li>
      <li class="list-group-item">Tenis</li>
      <li class="list-group-item">Natación</li>
      <li class="list-group-item">Atletismo</li>
    </ul>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
