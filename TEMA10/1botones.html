<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ejemplo 01 – Botones</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-5 text-center">
    <h1 class="h4 mb-4">Panel de botones (Bootstrap 5)</h1>

    <!-- 1) Botón principal con alerta -->
    <button type="button" class="btn btn-primary mb-3"
            onclick="alert('¡Has hecho clic en el botón principal!')">
      Botón principal
    </button>

    <!-- 2) Grupo de botones -->
    <div class="btn-group mb-3" role="group" aria-label="Grupo de botones">
      <button type="button" class="btn btn-secondary">Secundario</button>
      <button type="button" class="btn btn-success">Éxito</button>
      <button type="button" class="btn btn-danger">Peligro</button>
    </div>

    <!-- 3) Botón desplegable (dropdown) -->
    <div class="dropdown">
      <button class="btn btn-info dropdown-toggle" type="button"
              data-bs-toggle="dropdown" aria-expanded="false">
        Menú desplegable
      </button>
      <ul class="dropdown-menu">
        <li><a class="dropdown-item" href="#">Opción 1</a></li>
        <li><a class="dropdown-item" href="#">Opción 2</a></li>
        <li><a class="dropdown-item" href="#">Opción 3</a></li>
      </ul>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
