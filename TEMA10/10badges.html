<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ejemplo: muchos badges (Bootstrap)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

  <!-- Barra superior -->
  <nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="#">Panel</a>

      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-outline-primary position-relative" type="button">
          Notificaciones
          <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill text-bg-danger">
            7
            <span class="visually-hidden">notificaciones sin leer</span>
          </span>
        </button>

        <span class="badge text-bg-success rounded-pill">Online</span>
      </div>
    </div>
  </nav>

  <main class="container py-4">

    <!-- Títulos con badges -->
    <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
      <h1 class="h4 mb-0">Resumen</h1>
      <span class="badge text-bg-primary">Nuevo</span>
      <span class="badge text-bg-warning text-dark">Pendiente</span>
      <span class="badge text-bg-info text-dark">Info</span>
      <span class="badge text-bg-secondary">Beta</span>
    </div>

    <div class="row g-3">
      <!-- Card 1: Lista con contadores -->
      <div class="col-12 col-lg-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <h2 class="h6 mb-3">Bandejas</h2>

            <ul class="list-group">
              <li class="list-group-item d-flex justify-content-between align-items-center">
                Inbox
                <span class="badge text-bg-primary rounded-pill">12</span>
              </li>

              <li class="list-group-item d-flex justify-content-between align-items-center">
                Notificaciones
                <span class="badge text-bg-danger rounded-pill">3</span>
              </li>

              <li class="list-group-item d-flex justify-content-between align-items-center">
                Tareas
                <span class="badge text-bg-warning text-dark rounded-pill">5</span>
              </li>

              <li class="list-group-item d-flex justify-content-between align-items-center">
                Archivados
                <span class="badge text-bg-secondary rounded-pill">0</span>
              </li>
            </ul>
          </div>
        </div>
      </div>

      <!-- Card 2: Etiquetas (píldoras) -->
      <div class="col-12 col-lg-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <h2 class="h6 mb-3">Etiquetas del proyecto</h2>

            <div class="d-flex flex-wrap gap-2">
              <span class="badge rounded-pill text-bg-dark">UI</span>
              <span class="badge rounded-pill text-bg-primary">Bootstrap</span>
              <span class="badge rounded-pill text-bg-success">Hecho</span>
              <span class="badge rounded-pill text-bg-warning text-dark">Revisar</span>
              <span class="badge rounded-pill text-bg-info text-dark">Docs</span>
              <span class="badge rounded-pill text-bg-danger">Urgente</span>
              <span class="badge rounded-pill text-bg-secondary">Backlog</span>
              <span class="badge rounded-pill text-bg-light text-dark border">Diseño</span>
            </div>

            <hr class="my-3">

            <p class="mb-2">Estados:</p>
            <div class="d-flex flex-wrap gap-2">
              <span class="badge text-bg-success">Activo</span>
              <span class="badge text-bg-secondary">En pausa</span>
              <span class="badge text-bg-danger">Bloqueado</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Card 3: Botones con badges -->
      <div class="col-12">
        <div class="card shadow-sm">
          <div class="card-body">
            <h2 class="h6 mb-3">Acciones</h2>

            <div class="d-flex flex-wrap gap-2">
              <button class="btn btn-primary" type="button">
                Mensajes <span class="badge text-bg-light text-dark ms-1">4</span>
              </button>

              <button class="btn btn-outline-secondary" type="button">
                Revisiones <span class="badge text-bg-secondary ms-1">2</span>
              </button>

              <button class="btn btn-success" type="button">
                Confirmadas <span class="badge text-bg-light text-dark ms-1">8</span>
              </button>

              <button class="btn btn-danger" type="button">
                Alertas <span class="badge text-bg-light text-dark ms-1">1</span>
              </button>

              <a class="btn btn-link" href="#" role="button">
                Ver historial <span class="badge text-bg-primary ms-1">24</span>
              </a>
            </div>

          </div>
        </div>
      </div>
    </div>
              <i class="bi bi-camera"></i>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
