<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ejemplo: a, button e input como botón</title>

  <!-- Bootstrap CSS (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

  <h1 class="h5 mb-3">Mismo estilo <code>.btn .btn-primary</code> en distintos elementos</h1>

  <!-- 1) Enlace con aspecto de botón -->
  <a class="btn btn-primary me-2" href="#" role="button">Acción</a>

  <!-- 2) Formulario con botón submit y reset -->
  <form class="d-inline-block" action="#" onsubmit="event.preventDefault(); alert('Formulario enviado');">
    <button class="btn btn-primary me-2" type="submit">Enviar</button>
    <input class="btn btn-primary" type="reset" value="Reset">
  </form>

  <!-- Bootstrap JS bundle (opcional aquí) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
