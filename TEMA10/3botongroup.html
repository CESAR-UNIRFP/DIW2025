<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ejemplo: .btn-group y dropdown</title>

  <!-- Bootstrap CSS (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

  <h1 class="h5 mb-3">Filtros con <code>.btn-group</code> + botón dropdown</h1>

  <!-- 1) Grupo de botones: acciones relacionadas (filtro Día/Semana/Mes) -->
  <div class="btn-group mb-4" role="group" aria-label="Filtro de periodo">
    <button type="button" class="btn btn-secondary" onclick="setPeriodo('Día')">Día</button>
    <button type="button" class="btn btn-secondary" onclick="setPeriodo('Semana')">Semana</button>
    <button type="button" class="btn btn-secondary" onclick="setPeriodo('Mes')">Mes</button>
  </div>

  <!-- 2) Dropdown button (requiere JS bundle) -->
  <div class="dropdown">
    <button class="btn btn-info dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
      Opciones
    </button>

    <ul class="dropdown-menu">
      <li><a class="dropdown-item" href="#" onclick="accion('Exportar')">Exportar</a></li>
      <li><a class="dropdown-item" href="#" onclick="accion('Imprimir')">Imprimir</a></li>
      <li><a class="dropdown-item" href="#" onclick="accion('Restablecer')">Restablecer</a></li>
    </ul>
  </div>

  <!-- Zona de salida (para ver el resultado de las acciones) -->
  <p class="mt-4 mb-0">
    <strong>Estado:</strong> <span id="estado">Sin selección</span>
  </p>

  <script>
    function setPeriodo(texto) {
      document.getElementById("estado").textContent = "Periodo seleccionado: " + texto;
    }
    function accion(texto) {
      document.getElementById("estado").textContent = "Acción: " + texto;
    }
  </script>

  <!-- Bootstrap JS bundle (NECESARIO para dropdown) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
