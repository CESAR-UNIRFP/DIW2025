<!doctype html>
<html lang="es">
<head>
  <!-- Configuración básica -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Mini Campus (Bootstrap)</title>

  <!-- Bootstrap CSS por CDN (estilos) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
  <!-- =========================================
       NAVBAR (menú superior)
       - Es responsive: se colapsa en móvil
       ========================================= -->
  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container">
      <!-- Marca / logo -->
      <a class="navbar-brand fw-semibold" href="#">MiniCampus</a>

     <button class="navbar-toggler" type="button"
  data-bs-toggle="collapse" data-bs-target="#menu"
  aria-controls="menu" aria-expanded="false">
  <span class="navbar-toggler-icon" aria-hidden="true"></span>
  <span class="visually-hidden">Abrir menú</span>
</button>

      <!-- Menú colapsable (se abre/cierra con el botón hamburguesa) -->
      <div id="menu" class="collapse navbar-collapse">
        <!-- Enlaces del menú -->
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link active" href="#">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Tareas</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Mensajes</a></li>
        </ul>

        <!-- Botón con badge "pegado" (contador de notificaciones) -->
        <button class="btn btn-outline-primary position-relative" type="button">
          Notificaciones

          <!-- Badge posicionado encima del botón -->
          <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill text-bg-danger">
            3
            <!-- Texto solo para lectores de pantalla (accesibilidad) -->
            <span class="visually-hidden">notificaciones sin leer</span>
          </span>
        </button>
      </div>
    </div>
  </nav>

  <!-- =========================================
       CONTENIDO PRINCIPAL
       ========================================= -->
  <main class="container py-4">

    <!-- CABECERA: título + badges + botones -->
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
      <div>
        <h1 class="h4 mb-1">Panel del alumno</h1>

        <!-- Badges informativos (estado / contexto rápido) -->
        <div class="d-flex flex-wrap gap-2">
          <span class="badge text-bg-success">Online</span>
          <span class="badge text-bg-warning text-dark">2 tareas hoy</span>
          <span class="badge text-bg-info text-dark">DIW</span>
        </div>
      </div>

      <!-- Botones principales -->
      <div class="d-flex gap-2">
        <button class="btn btn-primary" type="button">Entregar tarea</button>
        <button class="btn btn-secondary" type="button">Ver calendario</button>
      </div>
    </div>

    <!-- 2 columnas en escritorio, 1 columna en móvil -->
    <div class="row g-3">

      <!-- =========================================
           CARD 1: LIST GROUP de tareas + badges
           ========================================= -->
      <div class="col-12 col-lg-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <h2 class="h6 mb-3">Tareas</h2>

            <!-- List group: cada elemento tiene texto + badge a la derecha -->
            <ul class="list-group">

              <!-- d-flex + justify-content-between => texto izquierda, badge derecha -->
              <!-- align-items-center => centra verticalmente el badge -->
              <li class="list-group-item d-flex justify-content-between align-items-center">
                Maquetar “Card” (Bootstrap)
                <span class="badge text-bg-danger rounded-pill">HOY</span>
              </li>

              <li class="list-group-item d-flex justify-content-between align-items-center">
                Navbar responsive
                <span class="badge text-bg-warning text-dark rounded-pill">Mañana</span>
              </li>

              <li class="list-group-item d-flex justify-content-between align-items-center">
                Repaso de botones
                <span class="badge text-bg-success rounded-pill">OK</span>
              </li>
            </ul>

            <!-- Botones de acciones relacionadas con la lista -->
            <div class="mt-3 d-flex gap-2">
              <button class="btn btn-success" type="button">Marcar como hecha</button>
              <button class="btn btn-outline-danger" type="button">Eliminar</button>
            </div>
          </div>
        </div>
      </div>

      <!-- =========================================
           CARD 2: LIST GROUP de mensajes + badge contador
           ========================================= -->
      <div class="col-12 col-lg-6">
        <div class="card shadow-sm">
          <div class="card-body">

            <!-- Título + badge "4 sin leer" -->
            <div class="d-flex align-items-center justify-content-between mb-3">
              <h2 class="h6 mb-0">Mensajes</h2>
              <span class="badge text-bg-primary rounded-pill">4 sin leer</span>
            </div>

            <!-- Lista con badges numéricos -->
            <ul class="list-group">
              <li class="list-group-item d-flex justify-content-between align-items-center">
                Profe DIW
                <span class="badge text-bg-primary rounded-pill">2</span>
              </li>

              <li class="list-group-item d-flex justify-content-between align-items-center">
                Grupo DAW
                <span class="badge text-bg-secondary rounded-pill">1</span>
              </li>

              <li class="list-group-item d-flex justify-content-between align-items-center">
                Administración
                <span class="badge text-bg-info text-dark rounded-pill">1</span>
              </li>
            </ul>

            <!-- Botón para ir a la bandeja -->
            <div class="mt-3">
              <button class="btn btn-outline-primary" type="button">Abrir bandeja</button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Bootstrap JS bundle (necesario para el navbar colapsable) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
