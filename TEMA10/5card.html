<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ejemplo 02 – Card</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-5 d-flex justify-content-center">


    <div class="card shadow-sm rounded" style="width: 18rem;">
      <img src="https://placehold.co/40x40/png" class="card-img-top" alt="Imagen de ejemplo">
      <div class="card-body">
        <h2 class="h5 card-title">Título de la tarjeta</h2>
        <p class="card-text mb-3">Descripción breve: una frase para explicar el contenido.</p>
        <a href="#" class="btn btn-primary">Más información</a>
      </div>
    </div>
  
  
  
  
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
