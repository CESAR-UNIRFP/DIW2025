<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ejemplo 04 – Navbar (buscador)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg bg-light shadow-sm">
    <div class="container-fluid">

      <a class="navbar-brand" href="#">
        <img src="https://placehold.co/40x40/png" alt="Logo" width="40" height="40"
             class="d-inline-block align-text-top">
        MiEmpresa
      </a>

      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse" data-bs-target="#navbarContent"
              aria-controls="navbarContent" aria-expanded="false"
              aria-label="Abrir/cerrar navegación">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">Inicio</a>
          </li>
        </ul>

        <!-- Buscador -->
        <form class="d-flex" role="search" onsubmit="event.preventDefault(); alert('Búsqueda enviada');">
          <input class="form-control me-2" type="search" placeholder="Buscar" aria-label="Buscar">
          <button class="btn btn-outline-success" type="submit">Buscar</button>
        </form>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <h1 class="h4">Página de ejemplo</h1>
    <p class="mb-0">El formulario queda a la derecha en pantallas grandes.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
