<!doctype html>
<html lang="es">
<head>
  <!-- 1) Meta básicos -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MiniCampus (simple)</title>

  <!-- 2) Bootstrap CSS (estilos) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

  <!-- =========================
       NAV (barra superior)
       ========================= -->
  <nav class="navbar bg-white border-bottom">
    <div class="container">
      <!-- Marca -->
      <a class="navbar-brand fw-semibold" href="#">MiniCampus</a>

      <!-- Enlaces (simple, sin colapsar para que el código sea mínimo) -->
      <div class="d-flex gap-3 align-items-center">
        <a class="text-decoration-none text-dark" href="#">Inicio</a>

        <!-- Link con badge (contador) -->
        <a class="text-decoration-none text-dark position-relative" href="#">
          Mensajes
          <!-- badge "pegado" al link -->
          <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill text-bg-danger">
            4
          </span>
        </a>

        <!-- Botón con badge (notificaciones) -->
        <button class="btn btn-outline-primary position-relative" type="button">
          Notificaciones
          <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill text-bg-danger">
            3
          </span>
        </button>
      </div>
    </div>
  </nav>

  <!-- =========================
       CONTENIDO
       ========================= -->
  <main class="container py-4">

    <!-- Tarjeta "bonita" con sombra -->
    <div class="card shadow-sm">
      <div class="card-body">

        <!-- Título + badge de estado -->
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h1 class="h5 mb-0">Panel del alumno</h1>
          <span class="badge text-bg-success">Online</span>
        </div>

        <!-- Botones principales (acciones) -->
        <div class="d-flex gap-2 mb-3">
          <button class="btn btn-primary" type="button">Entregar tarea</button>
          <button class="btn btn-secondary" type="button">Ver calendario</button>
        </div>

        <!-- LISTA con BADGES:
             - list-group-item: cada fila
             - d-flex justify-content-between: texto izquierda + badge derecha
             - badge: "insignia" (contador/estado) -->
        <p class="mb-2 fw-semibold">Tareas</p>
        <ul class="list-group">
          <li class="list-group-item d-flex justify-content-between align-items-center">
            Card (Bootstrap)
            <span class="badge text-bg-danger rounded-pill">HOY</span>
          </li>
          <li class="list-group-item d-flex justify-content-between align-items-center">
            Navbar responsive
            <span class="badge text-bg-warning text-dark rounded-pill">MAÑANA</span>
          </li>
          <li class="list-group-item d-flex justify-content-between align-items-center">
            Repaso de botones
            <span class="badge text-bg-primary rounded-pill">3</span>
          </li>
        </ul>

      </div>
    </div>

  </main>

</body>
</html>
