<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ejemplo botones Bootstrap</title>

  <!-- Bootstrap CSS (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

  <h1 class="h4 mb-3">Botones (todas las clases pedidas)</h1>

  <div class="d-flex flex-wrap gap-2">
    <button type="button" class="btn btn-primary">Guardar cambios</button>
    <button type="button" class="btn btn-secondary">Cancelar</button>
    <button type="button" class="btn btn-success">Confirmar</button>
    <button type="button" class="btn btn-danger">Eliminar</button>
    <button type="button" class="btn btn-warning">Revisar</button>
    <button type="button" class="btn btn-info">Más info</button>
    <button type="button" class="btn btn-light">Claro</button>
    <button type="button" class="btn btn-dark">Oscuro</button>
    <button type="button" class="btn btn-link">Ver detalles</button>
  </div>

  <!-- Bootstrap JS bundle (opcional aquí, pero estándar) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
