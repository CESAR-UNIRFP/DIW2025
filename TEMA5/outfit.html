<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejemplo object-fit</title>
    <link rel="stylesheet" href="css/estilooutfit.css">
</head>
<body>

  <h2>Comparativa de valores de <code>object-fit</code></h2>

  <div class="container">
    <div class="box">
      <img src="https://picsum.photos/id/237/400/300" style="object-fit: fill;">
      <div class="label">fill</div>
    </div>
    <div class="box">
      <img src="https://picsum.photos/id/237/400/300" style="object-fit: contain;">
      <div class="label">contain</div>
    </div>
    <div class="box">
      <img src="https://picsum.photos/id/237/400/300" style="object-fit: cover;">
      <div class="label">cover</div>
    </div>
    <div class="box">
      <img src="https://picsum.photos/id/237/400/300" style="object-fit: none;">
      <div class="label">none</div>
    </div>
    <div class="box">
      <img src="https://picsum.photos/id/237/400/300" style="object-fit: scale-down;">
      <div class="label">scale-down</div>
    </div>
  </div>

</body>
</html>
