<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ejemplo 2 - Flexbox (parrilla flexible)</title>
  <style>
    * { box-sizing: border-box; }

    body { margin: 0; font-family: Arial, sans-serif; }
    h1 { margin: 0; padding: 16px; background: #111; color: #fff; font-size: 18px; }

    .contenedor{
      max-width: 1000px;
      margin: 0 auto;
      padding: 16px;
    }

    .fila-flex{
      display: flex;          /* flex container */
      gap: 16px;
      align-items: stretch;
    }

    .item{ border: 2px solid #111; padding: 16px; background: #f5f5f5; }

    /* “equivalente” a 3/9 (25% / 75%) */
    .sidebar  { flex: 0 0 25%; }
    .contenido{ flex: 1; }

    .pill{
      display: inline-block;
      padding: 4px 10px;
      border: 2px solid #111;
      margin-top: 10px;
    }

    /* Breakpoint: apilar en móvil */
    @media (max-width: 768px){
      .fila-flex{ flex-direction: column; } /* cambia el eje principal */
      .sidebar{ flex-basis: auto; }         /* deja de fijar 25% */
    }

    /*
    Cuando la pantalla es pequeña, cambia el layout de 2 columnas a 1 columna y evita que la sidebar se quede “encogida” por el 25%.
    */
  </style>
</head>
<body>
  <h1>Ejemplo 2 — Flexbox: flex container/items + apilado con media query</h1>

  <div class="contenedor">
    <div class="fila-flex">
      <aside class="item sidebar">
        <b>Sidebar</b>
        <div class="pill">25% en desktop</div>
        <p>En pantallas pequeñas se apila arriba.</p>
      </aside>

      <main class="item contenido">
        <b>Contenido principal</b>
        <div class="pill">Ocupa el resto</div>
        <p>
          Flexbox coloca elementos sin floats. El contenedor define el flujo (row/column)
          y los items se adaptan según flex.
        </p>
      </main>
    </div>
  </div>
</body>
</html>
