<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Con viewport</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{font-family: Arial, sans-serif; margin: 0;}
    .box{
      width: 360px;
      margin: 16px auto;
      padding: 16px;
      border: 2px solid #000;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="box">
    Misma caja de 360px. CON viewport, el ancho del layout coincide con el ancho real del dispositivo,
    así que el texto se ve a tamaño normal y sin “alejar” la página.
  </div>
</body>
</html>
