<!doctype html>
<html lang="es">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{margin:0;font-family:Arial}
  .btn{margin:12px;padding:8px 12px;border:2px solid #111;background:#fff}
  .menu{position:fixed;top:0;left:0;height:100vh;width:220px;
        border-right:2px solid #111;background:#f5f5f5;padding:12px;
        transform:translateX(-230px); transition:transform .2s}
  .menu.abierto{transform:translateX(0)}
  @media (min-width:700px){ .menu{transform:translateX(0); position:static; height:auto; width:auto; border:2px solid #111} }
</style>

<button class="btn" onclick="document.querySelector('.menu').classList.toggle('abierto')">☰ Menú</button>
<div class="menu">
  <b>Navegación</b><br><br>
  En móvil está fuera y aparece al pulsar.
</div>
<div style="padding:12px">Contenido…</div>
</html>
