<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { background: white; }          /* estilo normal */

    @media (max-width: 600px) {          /* si la pantalla mide 600px o menos */
      body { background: rgb(167, 57, 57); }    /* cambia el fondo */
    }
  </style>
</head>
<body>
  Cambia el ancho de la ventana: en <= 600px el fondo cambia.
</body>
</html>
