<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    p { font-size: 50px; }               /* normal */

    @media (max-width: 600px) {          /* móvil */
      p { font-size: 16px; }             /* letra más pequeña */
    }
  </style>
</head>
<body>
  <p>Reduce el ancho: en <= 600px el texto se hace más pequeño.</p>
</body>
</html>
